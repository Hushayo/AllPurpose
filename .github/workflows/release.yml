# Builds AllPurpose.jar and attaches it to a GitHub Release.
# Trigger: push a tag like v2.1.0-b86, or manual Run workflow.
# The plugin's self-updater (/allpurpose update check|download) reads the
# latest release from this repo, so every tag published here becomes the
# version players/console can download in-game — no SFTP needed.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)publish (e.g. v2.1.0-b86)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.tag }}" ]; then TAG="${{ inputs.tag }}"; else TAG="${GITHUB_REF_NAME}"; fi
          [ -z "$TAG" ] && TAG="v2.1.0-dev"
          JARVER="$(echo "$TAG" | sed 's/^v//')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "jarver=$JARVER" >> "$GITHUB_OUTPUT"
          echo "Building $TAG (jar version $JARVER)"

      - name: Compile
        run: |
          mkdir -p classes
          find src -name '*.java' > sources.txt
          javac -nowarn --release 21 -encoding UTF-8 -cp "lib/*" -d classes @sources.txt

      - name: Package
        run: |
          mkdir -p dist
          cp plugin.yml classes/plugin.yml
          sed -i "s/^version:.*$/version: ${{ steps.ver.outputs.jarver }}/" classes/plugin.yml
          cp config.yml classes/config.yml
          [ -f changelog.txt ] && cp changelog.txt classes/changelog.txt || true
          jar --create --file dist/AllPurpose.jar -C classes .
          jar --list --file dist/AllPurpose.jar | grep -q '^plugin.yml$'
          echo "${{ steps.ver.outputs.jarver }}" > dist/version.txt
          (cd dist && sha256sum AllPurpose.jar > checksums.txt)
          cat dist/checksums.txt
          ls -la dist/

      - name: Sign artifacts (GPG, optional)
        # Setup: generate once (gpg --quick-generate-key "AllPurpose Releases"),
        # export public key into the repo as OFFICIAL_RELEASE_KEY.asc,
        # add the private key as repo secret GPG_PRIVATE_KEY (plus
        # GPG_PASSPHRASE if set). Skips gracefully until configured.
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then echo "No GPG_PRIVATE_KEY secret, skipping signatures."; exit 0; fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')
          echo "Signing with $KEYID"
          cd dist
          if [ -n "$GPG_PASSPHRASE" ]; then PASS="--pinentry-mode loopback --passphrase $GPG_PASSPHRASE"; else PASS=""; fi
          gpg --batch --yes $PASS --armor --detach-sign -u "$KEYID" checksums.txt
          gpg --batch --yes $PASS --armor --detach-sign -u "$KEYID" AllPurpose.jar
          ls -la

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: |
            dist/AllPurpose.jar
            dist/checksums.txt
            dist/version.txt
            dist/checksums.txt.asc
            dist/AllPurpose.jar.asc
