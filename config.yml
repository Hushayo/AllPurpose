survival-mode: true
# --- Linked-plugin guard: linked plugins should use AllPurposeAPI (read-only).
# Privileged RankManager calls (staffSet/setFrozen/lpSync) from outside
# com.hush.allpurpose are blocked + logged unless this is true.
allow-external-mutations: false
# --- Chat anti-spam: per-player cooldown (seconds between messages) ---
# OPs and rank.admins bypass. 0 = off. Applies on /allpurpose reload.
chatmod-cooldown-seconds: 5
chatmod-cooldown-message: "&cSlow down! Wait {s}s."
# --- Nametag: rank tag + hearts + lifetime kills ---
# Fully automatic. Updates on join, on damage/heal, and on a timer.
# No commands needed.
#
# mode:
#   tab      -> "[TAG] Name | 10.0 | Kills: 12"   (TAB renders it, no extra entities)
#   hologram -> stats float above the head, nametag below (two-line look)
#   both     -> both at once
#   off      -> plain "[TAG] Name"
#
# prefix / suffix go through TAB's API (mode: tab). TAB draws prefix+name+suffix,
# so the stats ride along as the suffix.
# tab-line is only used when TAB is NOT installed (vanilla display name).
# holo-line is the floating text for mode: hologram. Name left out on purpose.
#
# Placeholders: {rank} {prefix} {name} {hearts} {hp} {maxhp} {kills} {deaths}
#   {prefix} = the rank's coloured tag, e.g. "&aOWNER"
#   {hearts} = health / 2      {hp} = raw health
#   {abs} = absorption / 2 (gapple / god-apple yellow hearts)
#   {total} = (health + absorption) / 2 — use this for hologram hearts
nametag:
  mode: tab
  refresh-ticks: 10
  force-refresh-seconds: 5
  # Ping colour bands for {ping}:
  #   <= ping-good-ms green, <= ping-ok-ms yellow, above that red
  ping-good-ms: 60
  ping-ok-ms: 120
  prefix: "{prefix} "
  suffix: ""
  tab-line: "{prefix} {name}"
  holo-line: "&c❤ {total}"
# Death drops are KEPT (vanilla). Arena floor stays placeable via
# ground-cleanup instant-pickup above (loot kept, not destroyed).
# --- Death feed: REMOVED (ranks-only build) ---
# Kills count silently behind the rank ladder; death chat is vanilla.
# --- Discord relay (chat / joins / deaths / duels / ranks, no restart needed
# to TOGGLE: reads per-use; the feature itself activates on next boot) ---
# Paste the webhook URL to enable. Events toggle each feed individually.
discord-enabled: true
discord-webhook: ""
discord-events:
  joins: true
  chat: true
  deaths: true
  duels: true
  ranks: true
  plugin: true

# --- Bot command log grouping (console/log declutter) ---
# Bot players (registry + AGENT rank) spam "X issued server command: /..." every
# few seconds. mode:
#   group -> hide originals, emit one summary per window: [BotCmd] Name: /cmd (12x)
#   hide  -> hide originals, no summary
#   off   -> vanilla logging (floods)
# Window needs restart; mode applies on /allpurpose reload.
bot-command-log-mode: group
bot-command-log-window-seconds: 10
# --- TAB inactive tag: REMOVED (code hardcoded off, keys deleted) ---
# --- Kill effects: master switch only (old per-rank LT*/HT* entries removed, those ranks no longer exist) ---
# type: off|puff|rockets|lightning|storm. Add e.g. killfx: {VIP: {type: puff, count: 12}} to re-enable per rank.
killfx-enabled: false
killfx: {}
# --- Time Traveler advancement (ping hall of fame) ---
# Hit this ping (ms) and you earn allpurpose:time_traveler with toast + chat.
# 1000 = a full second of lag. Raise to make it rarer.
ping-advancement-ms: 1000
# --- Leaderboard holograms (one board per type) ---
# Place:  /lb holo <killtop|baltop|playtimetop|deathtop>   (/lb holo = all four)
# Remove: /lb removeholo <board>                           (/lb removeholo = all)
# Each board is billboard FIXED (it does NOT swing with the player's camera)
# and is oriented at placement so its readable face points at the placer.
# BALTOP reads Essentials userdata (same money /baltop ranks, honors
# baltop-exempt). Everything else reads our lb.yml. /allpurpose reload applies.
lb-holo-baltop-enabled: true
lb-holo-baltop-lines: 10
lb-holo-kill-lines: 10
lb-holo-deathtop-lines: 10
lb-holo-playtimetop-lines: 10
lb-holo-baltop-cache-seconds: 60
lb-holo-playtimetop-cache-seconds: 300
# --- Free-form text holograms: /setholotext (alias /holotext, /ht) ---
# Place:  /setholotext new <id> <text...>    (/setholotext add <text...> = auto id)
# The text is entirely yours - nothing is hardcoded. &-codes, #RRGGBB and
# <gradient:#AAA:#BBB>text</gradient> work, and a literal \n (or more
# /setholotext addline) makes extra lines.
# Every hologram is billboard FIXED, so it never sways with a player's camera,
# and its yaw is baked at placement so it faces the way you were looking
# (/setholotext rotate <id> <deg|here|left|right|flip|north|south|east|west>).
# Edit in place:  /setholotext text|addline|insertline|setline|delline|lines <id> ...
# Tune the look:  /setholotext style <id> <key> <value>
#   keys: billboard, align, background (#AARRGGBB|#RRGGBB|none|default),
#         linewidth, opacity, seethrough, shadow, glow, viewrange, scale
# Move / turn / inspect / delete:  move|rotate|tilt <id> | info|tp <id> | list | remove <id|all>
# Defaults below apply to any hologram that has not overridden that style key.
holotext:
  enabled: true
  default-billboard: fixed
  default-background: "#80000000"
  default-line-width: 300
  default-text-opacity: -1
  default-shadow: false
  default-see-through: false
  default-view-range: 0.6
# --- Server changelog dialogs (/changelog) ---
# Versions are boxes in a list; clicking one shows its lines one per line.
#   /changelog create v1 | add v1 <text...> | show [version] [player]
#   /changelog lines|setline|insertline|delline v1 ... | list | screen <on|off>
# The pause-menu copy is a generated datapack rewritten every boot, so edits to
# that copy appear after the NEXT restart. /changelog show is always instant.
# 'screen' here is only the initial default; /changelog screen stores its own.
changelog:
  enabled: true
  screen: true
  root-title: "&6&lMCPVPGG &7- &fChangelog"
  root-body: "&7Click a version to read its changes."
  button-width: 220
  # debug: log the datapack folder + a line on every rewrite (file+console).
  debug: false
# --- RCON console spam filter (keeps RCON enabled) ---
# Hides vanilla "Thread RCON Client /x.x.x.x started / shutting down" INFO
# lines plus the Essentials "Rcon issued server command: /list" polling echo.
# RCON itself keeps working — this is log-only. /allpurpose reload applies it.
rcon-spam-filter-enabled: true
# --- Bridge output capture (/apbridge exec) ---
# The minecraft-bridge MCP tool can run a command three ways: plain RCON
# (default), captured console (`method: "console"`) or captured player
# (`method: "player"` + `as: "<name>"`, experimental).
#
# WHY THE CAPTURE EXISTS: `lp user X info`, `co version` and `rg list` return 0
# bytes over plain RCON however long the bridge waits (verified live
# 2026-10-19: 8-9 s idle, still empty), while the same commands are fine from
# the console. Two separate reasons, both confirmed:
#   - Paper builds the vanilla CommandSourceStack for a dispatch and hands the
#     command the CONSOLE sender regardless of the CommandSender object passed
#     in (a custom proxy console sender gets its output redirected to the real
#     console; a proxy player throws "Cannot make <sender> a vanilla command
#     listener"). So sender interception cannot work at all.
#   - LuckPerms / CoreProtect / WorldGuard *log* their output instead of
#     addressing the sender, and the RCON socket only ever carries messages
#     addressed to the RCON sender.
# So /apbridge exec logs a unique begin marker, runs the command as the
# console, waits until logs/latest.log stops growing, logs an end marker, and
# copies the lines between the markers into
#   plugins/AllPurpose/bridge/<id>.txt   raw lines
#   plugins/AllPurpose/bridge/<id>.json  meta, written LAST (= payload ready)
# The bridge polls those over SFTP; its RCON reply is only a short ack.
#
# Console/RCON only: a player can never run it. Files are pruned each call.
bridge:
  enabled: true
  # Experimental player:<name> = run as that REAL online player. The point is
  # commands that refuse a console sender. Hard limit: output that goes only to
  # that player's chat cannot be read (no client connection) - only what the
  # command also logs is captured, and the player does receive it. An offline
  # target is refused and the bridge retries with method console.
  allow-player-mode: true
  # Never finish a capture before this, even if the log is idle: a plugin can
  # answer slightly late (LuckPerms logs on its own executor).
  min-wait-ms: 1000
  # ...then finish once the log has not grown for this long.
  quiet-ms: 600
  # Hard cap per call, so a chatty server can never keep the watcher running.
  max-wait-ms: 8000
  # Payload cap (chars); longer output is cut and flagged in the meta.
  max-bytes: 262144
  # Captures older than this are deleted on the next call.
  keep-minutes: 60
# --- Linked survival server (/survival, open to all) ---
transfer-host: "15.235.212.121"
transfer-port: 10066

# --- LuckPerms `parent set` guard (warn-only, never blocks) ---
# `lp user <name> parent set <group>` REPLACES every parent group, silently
# stripping `default` (warp/kits/msg). The safe form is additive:
# `lp user <name> parent add <group>`. When anyone runs the dangerous shapes
# (`parent set`, `parent clear`, `parent remove default`) they get a warning
# with the safe form + repair line, and it is logged. True = on.
lp-parent-guard-enabled: true

# --- Command guard: the commands LuckPerms alone cannot stop ---
# Paper gates vanilla commands with `minecraft.command.*` by OP LEVEL, so an
# opped player ignores a `false` node (verified live: an op ran /tick while
# minecraft.command.tick was false; a non-op was refused). Plugin commands
# (/eco, /gmc, /bounty, ...) ARE LP-gated even for ops.
# This cancels the listed commands for anyone WITHOUT the bypass permission -
# ops included. Entries ship as code defaults too, so the guard works even
# before this section is added to a live config.yml.
#   "cmd"       -> blocks every use
#   "cmd sub"   -> blocks only that subcommand ("tick rate" keeps /tick query)
# Exempt someone: /lp user <name> permission set allpurpose.commandguard.bypass true
# (RevengeByRain is exempt already: they hold `*`.)
command-guard:
  enabled: true
  bypass-permission: allpurpose.commandguard.bypass
  message: "&cThat command is disabled."
  commands:
    - effect
    - summon
    - "tick rate"
    - enchant

# --- LuckPerms group mirror: hushrank -> LP parent (kit permissions etc.) ---
# When a player GAINS a synced rank:  lp user <uuid> parent add <rank>
# When they LOSE it (removed, demoted, rank deleted): parent remove <rank>
# Runs as console commands; LP replies land in the server log.
# Backfill everyone: /rank lpsync all (after creating the LP groups below).
lp-sync-enabled: true
lp-sync-groups: []
# Ladder minimums: LP group -> lowest ladder rank that also earns it.
# Example: mykit: VIP means everyone holding VIP or anything above it on the ladder
# keeps the group too, so higher ranks keep the lower kits.
lp-sync-minimums: {}

# --- Auto-rank ladder: lifetime kills promote you through it (/rank ladder) ---
# Ladder must start with MEMBER. rankup-kills = kills needed to ENTER that rank.
# Old PvP ladder (LT*/HT*/...) removed: those ranks no longer exist (see /rank list).
# auto-rankup: false freezes all automatic promotions (manual /rank upgrades still work).
auto-rankup: true
rank-ladder: [MEMBER]
rankup-kills: {}


# --- LP temp-group expiry notifier (tells player when a temp rank lapses) ---
# Watch [] = all temp groups. Message placeholders: {group} {player}.
lp-expiry-enabled: true
lp-expiry-check-seconds: 60
lp-expiry-notify-on-join: true
lp-expiry-watch-groups: []
lp-expiry-message: "&cYour rank &f{group} &chas expired!"



# --- Discord invite auto-announce (clickable tellraw, activity-gated) ---
# Every interval-minutes (restart to change), if at least min-players REAL
# (non-bot) players are online, broadcasts: line + clickable [invite].
# Click opens invite-url (hover shows "Click to join Discord").
# enabled/min-players/invite-url/line apply on /allpurpose reload.
discord-ad:
  enabled: true
  interval-minutes: 10
  min-players: 5
  invite-url: "https://discord.gg/mzF5Qk594f"
  line: "&7Join our &bDiscord &7server: "

# --- Discord public chat log (BOT, same token as status board) ---
# Logs player chat + /say + /broadcast + join/quit/death public messages to
# channel-id via the STATUS BOT (not a webhook), so custom guild emoji render.
# READABLE layout (owner request 2026-10-19): plain text lines, NOT embeds. A
# player line starts with the speaker's own HEAD emoji, then the rank tag and
# the **bold** player name, then the message:
#   <:head_ab12cd34ef56:1234> [ADMIN] **KingsterVV**: btw cmere
# (the tag itself can't be coloured — Discord only colours embeds, not message
# text). The head is a guild emoji from the status board's cache: the board
# uploads one head per tick for everyone online, so a chatting player's head is
# normally already cached, and the Steve/bust glyph shows until it is. That
# needs discord-status enabled (same bot token/guild).
# heads: false -> no head prefix.
# Toggles apply on /allpurpose reload (needs restart once to install).
discord-chatlog:
  enabled: true
  channel-id: "1560744974386077867"
  heads: true
  chat: true
  broadcast: true
  joins: true
  deaths: true

# --- Discord command + DM audit log (rule 12: "ingame and Discord") ---
# Two SEPARATE feeds on the STATUS BOT (same token, no webhook):
#   command log -> channel-id      (staff-only channel)
#   DM log      -> dm-channel-id   (owner + developer only; empty = file only)
# Every line is also mirrored to
#   plugins/AllPurpose/commandlog/commands-YYYY-MM-DD.log
#   plugins/AllPurpose/commandlog/dms-YYYY-MM-DD.log
# so the record survives a deleted channel, a bot outage or a restart, and it
# covers the gap CoreProtect cannot: commands, console actions, private messages.
#
# Capture is PlayerCommandPreprocessEvent (players) + ServerCommandEvent
# (console/RCON) at MONITOR with ignoreCancelled=false, so BLOCKED attempts
# (/op, guarded commands) are recorded too, not just the ones that ran.
#
# Never written, in Discord or in the file: /login /register /changepassword
# /email /auth /2fa ... (logged as "<name> <redacted>"), webhook URLs and
# token=... arguments. Add any other credential-taking command to
# redact-commands.
#
# Note for the rule text: this covers every ingame command and /msg-style
# private message, mirrored to Discord. It does NOT read Discord DMs.
discord-commandlog:
  enabled: true
  channel-id: "1562354261466153040"
  dms: true
  dm-channel-id: ""            # empty = the DM feed stays in the local file only
  console: true                # commands typed into the server console
  rcon: true                   # commands sent over RCON (bridge / panel)
  include-bots: false          # bots.yml accounts spam; keep them out
  uuid-in-discord: false       # UUID stays in the local file only
  coords-in-discord: false     # exact x/y/z stay in the local file only; Discord gets "@ world"
  file: true
  file-dir: "commandlog"
  batch-seconds: 2             # async flush cadence (one message per feed per flush)
  discord-lines-per-flush: 24
  max-posts-per-flush: 3       # hard cap; the rest becomes one "… +N more" line
  queue-cap: 2000              # overflow drops oldest and reports the count
  ignore-commands: [spawn, home, sethome, tpa, tpahere, tpaccept, tpdeny, back, warp]
  dm-commands: [msg, tell, whisper, emsg, pm, dm, r, reply]
  redact-commands: [login, register, changepassword, changepass, passwd, password, email, auth, 2fa, totp, unregister, setpassword]

# --- Discord live status board (bot, edits ONE message every 15s) ---
# Needs a BOT token (not a webhook): Discord Developer Portal -> your app ->
# Bot -> Reset Token, then invite the bot with View Channel + Send Messages +
# Embed Links in that channel. /allpurpose reload re-reads token/channel/
# interval immediately (no restart). Empty bot-token = board off.
# No-resend: the message id is stored in plugins/AllPurpose/
# discord_status_id.txt; on boot the bot re-edits it, and if the file is lost
# it adopts the recent board via a hidden marker instead of posting a dup.
# On shutdown it flips the same message to OFFLINE.
# NOTE: Discord message text cannot embed arbitrary SVG files — only unicode
# emoji or server custom emoji, and the emoji API only accepts PNG/JPEG/GIF.
# So the bot uploads white 128px PNGs rasterized from the Heroicons SVG set
# (MIT) as 7 server emoji (hi_users, hi_bolt, hi_cube, hi_smile, hi_sparkles,
# hi_online, hi_offline) on first boot and reuses them forever, then deletes
# the old Twemoji set. The bot needs Manage Emojis permission for the one-time
# upload; without it the board falls back to identical unicode glyphs.
# emoji-upload: false skips the upload and always uses unicode.
# Board has no title/footer (owner request). The quote line is the live MOTD,
# session: is only the fallback when the MOTD is unreadable.
discord-status:
  enabled: true
  bot-token: ""
  channel-id: "1559211061553401986"
  update-seconds: 15
  emoji-upload: true
  head-expiry-minutes: 10
  server-address: "mcpvpggg.mcsh.io"
  session: "Secret SMP session 3"

# --- Self-updater (repo-based, no SFTP needed) ---
# Source of truth: GitHub Releases on update-repo (built by
# .github/workflows/release.yml — every v* tag gets AllPurpose.jar +
# checksums.txt). Flow: /allpurpose update check -> download -> restart.
# The running jar is never touched while loaded; the staged jar replaces
# plugins/AllPurpose.jar during a real shutdown (old jar backed up first).
# Applies on next boot. NEVER /reload to apply — restart only.
update-enabled: true
update-repo: "Hushayo/AllPurpose"
update-asset-name: "AllPurpose.jar"

# --- Spectator live-cam stale guard (spare-laptop screenshots, separate) ---
# The cam script on spare edits ONE message (marker SPAWN_CAM_LIVE) in the
# board channel. If its Discord edited_timestamp is older than stale-minutes
# (spare MC closed, laptop dead), this DELETES the message. Empty channel-id
# = same channel as the status board. /allpurpose reload applies.
discord-spectator-cam:
  enabled: true
  channel-id: ""
  stale-minutes: 10
  check-minutes: 3

# --- Auto-login (LoginSecurity) for specific accounts ---
# Names here are logged in automatically right after they join (via the
# LoginSecurity API, no password typed). Used for the spare-laptop spectator
# so a restart never leaves it stuck at the /login prompt. Empty = off.
auth-auto-login-players:
- ruzzer

# --- Discord spawn snapshot (top-down spawn render, ONE message, edited) ---
# No bot slot, no browser, no new infra: renders loaded chunks around the
# main world's spawn to PNG and edits one message in place. Same bot token as
# the board above. Unloaded chunks are skipped (never generated). Channel-id
# empty = same channel as the board. /allpurpose reload applies.
# The image reads like a map (vanilla-ish block colours, height shading,
# 32-block grid, north-up compass) and marks every player standing inside the
# view with a coloured pin; the message text lists them with a coarse distance,
# direction and Y band, plus how many are online further out / in other worlds.
# Positions are deliberately quantised: a pin is the centre of a 16-block cell,
# distance rounds to 16 blocks and Y to a 16-block bucket. Do not make them
# exact -- the view reaches past the (pvp-deny) spawn region, so an exact pin
# becomes a locator for hunting players in the band outside it.
# radius-blocks = half the width of the square view (128 = 256x256 blocks).
discord-snapshot:
  enabled: true
  channel-id: ""
  interval-minutes: 5
  radius-blocks: 128

# --- Coinflip (Vault/EssentialsX economy, GUI) ---
# /coinflip (alias /cf) opens the lobby: one player head per open wager.
# A player wagers an amount (escrowed through Vault the moment it is created);
# anyone can click the head to match it and a 50/50 flip decides the winner,
# who takes the whole pot. /coinflip <amount> opens one straight away.
# min/max-wager clamp the bet, tax-percent is the house cut off the pot,
# expire-seconds refunds an untaken wager, presets fill the GUI buttons.
coinflip:
  enabled: true
  min-wager: 100
  max-wager: 1000000
  tax-percent: 0
  expire-seconds: 600
  broadcast: true
  announce: true
  presets: [100, 500, 1000, 5000, 10000, 50000, 100000, 1000000]

# --- Bounty (Vault/EssentialsX economy, GUI) ---
# /bounty opens the board of hunted players; clicking a head lets you add
# money to that player's bounty. The killer of a hunted player collects the
# whole pot (escrowed at placement, tracked per contributor in
# plugins/AllPurpose/bounties.yml so it survives restarts).
# tax-percent is the house cut, broadcast/announce push the kill to chat +
# the Discord chat log. Admin: /bounty clear <player> refunds every backer.
bounty:
  enabled: true
  min-bounty: 100
  max-bounty: 1000000000
  tax-percent: 0
  broadcast: true
  announce: true
  presets: [100, 500, 1000, 5000, 10000, 50000, 100000, 1000000]

# --- Chest shops (Vault/EssentialsX economy, physical chests) ---
# Sneak + right-click a chest/barrel/shulker to set it up. Right-click someone
# else's shop to trade (a confirm screen opens first). /shop browses them all.
# A sneak-click that would place a block is left alone (vanilla), so you can
# still build on top of a chest while holding blocks; with a block in hand,
# manage your own shop from /shop (your shop -> click) instead.
#   SELL shop: the owner stocks the chest; buyers pay `price` for `quantity`.
#   BUY  shop: sellers hand over `quantity` items; the owner's balance pays.
# tax-percent is the house cut off the OWNER's side of each trade (a SELL owner
# receives price minus tax; a BUY owner pays price plus tax).
# max-per-player caps owned shops; override per player with the permission
# allpurpose.shop.limit.<n> (allpurpose.shop.admin = unlimited + manage any).
# protect-shops keeps shop chests out of explosions and pistons;
# allow-automation false also stops hoppers draining or filling them.
#
# LABELS: a floating TextDisplay above each chest, drawn ON DEMAND only.
# TextDisplays are entities, so one per shop would scale badly - instead a label
# exists only while a player is within label-radius (plus label-hysteresis to
# stop it flickering at the edge), capped at label-max at once, rendered with a
# reduced client view range and never persisted. Cost follows "shops near
# players", never the total shop count. label-mode: nearby | off.
shop:
  enabled: true
  min-price: 1
  max-price: 1000000000
  tax-percent: 0
  max-per-player: 5
  allow-double-chest: true
  protect-shops: true
  allow-automation: false
  log-transactions: true
  announce-sales: false
  preset-prices: [10, 100, 1000, 10000]
  label-mode: nearby
  label-radius: 12
  label-hysteresis: 4
  label-max: 24
  label-update-ticks: 20

# --- Wealth tax ("prosperity audit"): random, capped, PROGRESSIVE levy ---
# Shown in chat as a "prosperity audit" event, not a punishment.
# Ships DISABLED: set enabled: true to arm it. /allpurpose reload re-reads this.
#
# TIMING: one check per UTC day. Each daily check has daily-chance-percent
# chance to actually collect, so most weeks are quiet and a tax-free week is
# common (15% => roughly one event every 6-7 days; ~32% of weeks see nothing).
# A fresh install never levies on its first day.
#
# RATES are MARGINAL/progressive: only the slice of a balance inside each band
# is taxed, so $50,001 is never taxed as if it were a flat rate on the whole
# balance. Default bands (the owner's table):
#     up to  50,000            -> 0%   (new/low players pay nothing)
#      50,000 -   100,000      -> 1%
#     100,000 -   250,000      -> 2%
#     250,000 and above        -> 3%   (up-to: -1 = open-ended top band)
# Bots, the non-human accounts in AGENTS 0.1, and exempt-players are skipped.
# max-per-event is the HARD CEILING on the per-player cap. Each event rolls its
# own cap somewhere between cap-floor-percent% and 100% of it (60 => $15k-$25k),
# so a whale is not hit for the identical amount every single time. The rolled
# cap is shared by every payer in that event and is shown in the preview, so
# /tax run confirm collects exactly what the preview promised.
#
# TREASURY (virtual): every deduction and deposit is written to
# plugins/AllPurpose/tax.yml (raised / spent / per-player ledger). The ledger
# IS the treasury - its balance is raised minus spent, with no fake bank
# account. Payouts (/tax pay and starter grants) come out of that balance.
#   treasury-account: ""        -> virtual ledger treasury (recommended).
#   treasury-account: "Treasury" -> optional: hold the money in a real
#                            Essentials account instead (flagged baltop-exempt,
#                            so it stays off /baltop).
#
# PUBLIC:   /tax balance | /tax patrons   (anyone - the fund's public face)
# INSPECT:  /tax info | /tax rates | /tax ledger | /tax spends
# CONTROL:  /tax run (PREVIEW only) -> /tax run confirm (collects for real)
#           /tax pay <player> <amount> <reason>   (insurance bucket)
#           /tax prize <player> <amount> <reason> (prize bucket)
#           /tax spend <amount> <note>            (bookkeeping only)
# A /tax run confirm that collects also marks that UTC day as rolled, so the
# random roll can never stack a second audit on the same day.
tax:
  enabled: false
  daily-chance-percent: 15
  max-per-event: 25000
  # Rolled per-event cap floor, as a percent of max-per-event. 100 = always the
  # full cap (the old, fixed behaviour). Lower = a wider random swing.
  cap-floor-percent: 60
  min-tax: 1
  max-payout: 25000
  daily-payout-cap: 50000
  pay-repeat-window-minutes: 1440
  announce: true
  discord: true
  skip-bots: true
  exempt-players: [RevengeByRain]
  treasury-account: ""
  treasury-baltop-exempt: true
  ledger-keep: 200
  # Earmarks split every collection into sub-balances, so one purpose can never
  # eat another. Values are normalised across the buckets given (70/20/10 == 7/2/1).
  # /tax pay draws from "insurance", /tax prize from "prize", starter grants
  # from "starter-grant". A payout can only ever spend its own bucket.
  earmarks:
    insurance: 70
    starter-grant: 20
    prize: 10
  brackets:
    - { up-to: 50000, percent: 0 }
    - { up-to: 100000, percent: 1 }
    - { up-to: 250000, percent: 2 }
    - { up-to: -1, percent: 3 }
  # Steeper example (up to 10%): replace the list above with:
  # brackets:
  #   - { up-to: 50000, percent: 0 }
  #   - { up-to: 100000, percent: 2 }
  #   - { up-to: 250000, percent: 5 }
  #   - { up-to: -1, percent: 10 }
  #
  # PAYOUTS: /tax pay <player> <amount> <reason> moves treasury money to a player
  # (grief insurance), /tax prize ... uses the prize bucket; both require a reason
  # and record the staff member, target, bucket and note in /tax spends.
  # max-payout caps a single payout; daily-payout-cap caps each bucket's total
  # payouts per UTC day (0 = no cap); pay-repeat-window-minutes blocks the same
  # staff member from paying the same player twice in that window (0 = off).
  # A payout can never exceed its bucket, so the balance cannot go negative and
  # payouts can never inflate the economy - the fund only shrinks or holds flat.

# --- Starter grant (treasury-funded welcome for new players) ---
# Once a NEW player reaches playtime-minutes of playtime they receive a
# one-time grant paid out of the wealth-tax treasury's starter-grant bucket
# (recorded as a spend, so it shows in /tax info and /tax spends, and /tax grants).
# "New" = first joined AFTER the feature was first armed; accounts that existed
# before it are grandfathered unless include-existing: true. With
# require-funds: true a player waits until the starter-grant bucket can actually
# cover the grant, so grants only start flowing after the first tax event.
# Inspect paid grants: /tax grants
# AFK CAVEAT (known, deferred): play_time accrues while idle, so a determined alt
# can farm the grant. The intended fix (not yet built) is to count only ACTIVE
# minutes - moved or interacted recently - and to cap one grant per IP or
# Discord-linked account. Until then keep the grant disabled or the amount small.
starter-grant:
  enabled: false
  playtime-minutes: 60
  amount: 5000
  require-funds: true
  include-existing: false
  announce: true
  message: '&aWelcome, &f{player}&a! You reached &f{time} &aof playtime - the community fund grants you &f{amount}&a.'

# --- Weekly prize draw (treasury-funded, one winner a week) ---
# Every week one ACTIVE player is drawn at random and paid `amount` out of the
# wealth-tax treasury's PRIZE bucket. It gives the prize earmark something to
# actually spend on: audit -> 10% to prizes -> one player wins it each week.
#
# Eligible = appeared in Essentials userdata (so it has really played), seen
# within active-days, lifetime playtime >= min-playtime-minutes, and not a bot
# (bots.yml), a non-human account (mcpvpgg/ritgo_*) or the treasury account.
# The playtime floor stops a one-login alt from winning.
#
# Schedule: day + hour-utc are UTC (Saturday 12:00 UTC == 20:00 local). It arms
# on first enable, so it never pays the moment it is turned on - the first draw
# waits for the next slot. A slot missed while the server was down is caught up
# on the next check. If the prize bucket can't cover `amount`, the slot is
# skipped (logged), not drained.
#
# Payouts go through the same path as /tax pay: capped per payout, capped per
# day, can never exceed the prize bucket, and recorded in /tax spends.
# Inspect: /tax draws   Preview: /tax draw   Draw now: /tax draw confirm
# Ships DISABLED (prize-draw.enabled: false).
prize-draw:
  enabled: false
  amount: 5000
  day: saturday
  hour-utc: 12
  active-days: 7
  min-playtime-minutes: 120
  exclude-players: []
  announce: true
  discord: true

